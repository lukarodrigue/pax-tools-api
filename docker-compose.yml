services:
  banco:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # sem "ports": o banco so existe dentro da rede do compose

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}
      COOKIE_SEGURO: ${COOKIE_SEGURO}
      ORIGENS_PERMITIDAS: ${ORIGENS_PERMITIDAS:-}
      PORT: 3000
    depends_on:
      banco:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  web:
    # o front vive em outro repositorio; as duas pastas precisam estar
    # lado a lado no servidor, com estes nomes exatos
    build: ../pax-tools-web
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dados-caddy:/data
      - config-caddy:/config
    depends_on:
      - api
      - web

volumes:
  dados-postgres:
  dados-caddy:
  config-caddy:
